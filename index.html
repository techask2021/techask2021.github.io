<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Electronic Apps - SpotSaver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0B101E; color: #F1F5F9; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .card { background: #151D33; border: 1px solid #233054; border-radius: 20px; padding: 40px 30px; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; color: #FFFFFF; }
        p { color: #94A3B8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .badge { display: inline-block; background: rgba(249, 115, 22, 0.15); color: #F97316; font-weight: 600; font-size: 13px; padding: 6px 14px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(249, 115, 22, 0.3); }
        .btn { display: inline-block; background: #F97316; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 14px 28px; border-radius: 12px; text-decoration: none; transition: background 0.2s ease; margin-bottom: 20px; }
        .btn:hover { background: #EA580C; }
        .links { display: flex; justify-content: center; gap: 16px; font-size: 13px; margin-top: 10px; }
        .links a { color: #64748B; text-decoration: none; }
        .links a:hover { color: #94A3B8; }
        footer { margin-top: 30px; color: #475569; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Official Developer Portal</div>
        <h1>SpotSaver: Parking Reminder</h1>
        <p>Never lose your parked car again. Smart GPS auto-save, anti-overwrite spot lock protection, walking compass directions, and parking meter alarms.</p>
        <a href="https://play.google.com/store/apps/details?id=com.spotsaver.parkingreminder" class="btn" target="_blank">Get it on Google Play</a>
        <div class="links">
            <a href="https://sites.google.com/view/spotsaver-privacy/home" target="_blank">Privacy Policy</a>
            <a href="/app-ads.txt" target="_blank">app-ads.txt</a>
        </div>
    </div>
    <footer>© 2026 Unity Electronic. All rights reserved.</footer>
</body>
</html>
